name: PixelEngine CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4 # v4 is the current .NET action
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\PixelEngine.sln
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::dotnet restore failed"; exit 1 }

      - name: Build Debug
        id: build-debug
        shell: pwsh
        run: |
          $log = (& dotnet build .\PixelEngine.sln -c Debug --no-restore "-clp:NoSummary" 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $log
          $errors = $log -split "`r?`n" | Where-Object { $_ -match ': error ' } | Select-Object -Unique
          $warnings = $log -split "`r?`n" | Where-Object { $_ -match ': warning ' } | Select-Object -Unique
          foreach ($line in ($errors | Select-Object -First 40)) { Write-Host "::error::$line" }
          foreach ($line in ($warnings | Select-Object -First 20)) { Write-Host "::warning::$line" }
          Write-Host "Debug build: $($errors.Count) error(s), $($warnings.Count) warning(s)."
          if ($code -ne 0) { exit 1 }

      - name: Build Release
        shell: pwsh
        run: |
          $log = (& dotnet build .\PixelEngine.sln -c Release --no-restore "-clp:NoSummary" 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $log
          $errors = $log -split "`r?`n" | Where-Object { $_ -match ': error ' } | Select-Object -Unique
          foreach ($line in ($errors | Select-Object -First 40)) { Write-Host "::error::$line" }
          if ($code -ne 0) { exit 1 }

      - name: Smoke tests
        shell: pwsh
        run: |
          $log = (& dotnet run --project .\PixelEngine.SmokeTests\PixelEngine.SmokeTests.csproj -c Release --no-build -- . 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $log
          # Case-sensitive FAIL and a PASS guard: a case-insensitive match turned ordinary lines
          # such as "failed-attachment cleanup" into false CI failures.
          $failures = $log -split "`r?`n" | Where-Object { $_ -notmatch '^PASS' -and ($_ -match '^\s*-\s' -or $_ -cmatch '^FAIL') } | Select-Object -Unique
          foreach ($line in ($failures | Select-Object -First 60)) { Write-Host "::error::$line" }
          if ($code -ne 0) { Write-Host "::error::Smoke tests exited with code $code"; exit 1 }

      - name: Editor tests
        shell: pwsh
        run: |
          $log = (& dotnet run --project .\PixelEngine.Editor.Tests\PixelEngine.Editor.Tests.csproj -c Release --no-build 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $log
          $failures = $log -split "`r?`n" | Where-Object { $_ -match '^\s*-\s' -or $_ -match '^FAIL' } | Select-Object -Unique
          foreach ($line in ($failures | Select-Object -First 60)) { Write-Host "::error::$line" }
          if ($code -ne 0) { Write-Host "::error::Editor tests exited with code $code"; exit 1 }

      - name: Smoke tests (Debug)
        shell: pwsh
        run: |
          $log = (& dotnet run --project .\PixelEngine.SmokeTests\PixelEngine.SmokeTests.csproj -c Debug --no-build -- . 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $log
          # Case-sensitive FAIL and a PASS guard: a case-insensitive match turned ordinary lines
          # such as "failed-attachment cleanup" into false CI failures.
          $failures = $log -split "`r?`n" | Where-Object { $_ -notmatch '^PASS' -and ($_ -match '^\s*-\s' -or $_ -cmatch '^FAIL') } | Select-Object -Unique
          foreach ($line in ($failures | Select-Object -First 60)) { Write-Host "::error::$line" }
          if ($code -ne 0) { Write-Host "::error::Smoke tests exited with code $code"; exit 1 }
