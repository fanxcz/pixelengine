name: Deploy PixelEngine website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'fanxcz/pixelengine'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate website files and internal links
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/style.css
          test -s docs/favicon.svg
          test -f docs/.nojekyll
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ("href", "src") and value:
                          self.refs.append(value)
          parser = Links()
          parser.feed(Path("docs/index.html").read_text(encoding="utf-8"))
          missing = []
          for ref in parser.refs:
              if ref.startswith(("#", "https://", "http://", "mailto:", "data:")):
                  continue
              path = (Path("docs") / urlparse(ref).path).resolve()
              if not path.exists():
                  missing.append(ref)
          if missing:
              raise SystemExit("Missing website assets: " + ", ".join(missing))
          print(f"Validated {len(parser.refs)} href/src references in docs/index.html")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
