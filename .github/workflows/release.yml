name: PixelEngine Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

jobs:
  build-test-package:
    if: >-
      github.repository == 'fanxcz/pixelengine' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          startsWith(github.event.head_commit.message, 'release: v')
        )
      )
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution and legacy projects
        shell: pwsh
        run: |
          dotnet restore .\PixelEngine.sln
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet restore .\PixelFight\PixelFight.csproj
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet restore .\PixelFight.Editor\PixelFight.Editor.csproj
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet restore .\PixelFight.Player\PixelFight.Player.csproj
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet restore .\PixelFight.Tests\PixelFight.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Validate website and bundled game sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $siteRoot = Join-Path (Get-Location).Path 'docs'
          $siteIndex = Join-Path $siteRoot 'index.html'
          $html = Get-Content -LiteralPath $siteIndex -Raw
          $references = [regex]::Matches($html, '(?i)(?:href|src)="([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          foreach ($reference in $references) {
            if ($reference -match '^(#|https?://|mailto:|data:)') { continue }
            $localPath = [uri]::UnescapeDataString(($reference -split '[?#]', 2)[0])
            $resolvedPath = Join-Path $siteRoot $localPath
            if (-not (Test-Path -LiteralPath $resolvedPath -PathType Leaf)) {
              throw "Website references a missing local file: $reference"
            }
          }

          foreach ($required in @('style.css', 'favicon.svg', 'sitemap.xml', 'robots.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $siteRoot $required) -PathType Leaf)) {
              throw "Website asset is missing: $required"
            }
          }

          $licRoots = @('Lic', 'Games') | ForEach-Object { Join-Path (Get-Location).Path $_ }
          $projects = @($licRoots | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter '*.lic' -File -Recurse })
          if ($projects.Count -lt 9) {
            throw "Expected at least 9 bundled LIC projects (Lic samples + Ashfall); found $($projects.Count)."
          }

          $ashfallRoot = Join-Path (Get-Location).Path 'Games\Ashfall'
          foreach ($required in @('Ashfall.lic', 'Game\game.lua', 'Assets', 'README.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $ashfallRoot $required))) {
              throw "Ashfall project file is missing: $required"
            }
          }
          Write-Host "Validated $($references.Count) website references and $($projects.Count) bundled LIC projects."

      - name: Build Release
        shell: pwsh
        run: dotnet build .\PixelEngine.sln -c Release --no-restore

      - name: Runtime smoke tests
        shell: pwsh
        run: dotnet run --project .\PixelEngine.SmokeTests\PixelEngine.SmokeTests.csproj -c Release --no-build -- .

      - name: Editor headless tests
        shell: pwsh
        run: dotnet run --project .\PixelEngine.Editor.Tests\PixelEngine.Editor.Tests.csproj -c Release --no-build

      - name: Build Bloody Pixels legacy Windows projects
        shell: pwsh
        run: |
          dotnet build .\PixelFight\PixelFight.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build .\PixelFight.Editor\PixelFight.Editor.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build .\PixelFight.Player\PixelFight.Player.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build .\PixelFight.Tests\PixelFight.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Bloody Pixels legacy regression tests
        shell: pwsh
        run: |
          $log = (& dotnet run --project .\PixelFight.Tests\PixelFight.Tests.csproj -c Release --no-build 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $log
          if ($code -ne 0) { Write-Host "::error::Bloody Pixels tests exited with code $code"; exit 1 }
          if ($log -notmatch 'PASS') { Write-Host "::error::Legacy test runner produced no PASS marker"; exit 1 }

      - name: Publish self-contained Studio
        shell: pwsh
        run: |
          dotnet publish .\PixelEngine.Editor\PixelEngine.Editor.csproj --configuration Release --runtime win-x64 --self-contained true --output "$env:RUNNER_TEMP\pixelengine\editor" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false

      - name: Publish self-contained Player with native SDL files
        shell: pwsh
        run: |
          dotnet publish .\PixelEngine.Sandbox\PixelEngine.Sandbox.csproj --configuration Release --runtime win-x64 --self-contained true --output "$env:RUNNER_TEMP\pixelengine\player" -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:TieredCompilation=false -p:DebugType=None -p:DebugSymbols=false
          $playerDir = Join-Path $env:RUNNER_TEMP 'pixelengine\player'
          $sdl = Get-ChildItem -LiteralPath $playerDir -Filter 'SDL2.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $sdl) {
            throw "SDL2.dll is missing from the published Player output. MonoGame DesktopGL cannot initialize without its native SDL runtime."
          }
          Write-Host "Found native SDL runtime: $($sdl.FullName) ($($sdl.Length) bytes)"

      - name: Publish Bloody Pixels legacy Windows applications
        shell: pwsh
        run: |
          $legacyRoot = Join-Path $env:RUNNER_TEMP 'pixelengine\legacy'
          $legacyGame = Join-Path $legacyRoot 'game'
          $legacyEditor = Join-Path $legacyRoot 'editor'
          $legacyPlayer = Join-Path $legacyRoot 'player'

          dotnet publish .\PixelFight\PixelFight.csproj -c Release -r win-x64 --self-contained true --output $legacyGame -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the original Bloody Pixels game." }

          dotnet publish .\PixelFight.Editor\PixelFight.Editor.csproj -c Release -r win-x64 --self-contained true --output $legacyEditor -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the original Bloody Pixels editor." }

          dotnet publish .\PixelFight.Player\PixelFight.Player.csproj -c Release -r win-x64 --self-contained true --output $legacyPlayer -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the original Bloody Pixels Player." }

          $requiredExecutables = @(
            (Join-Path $legacyGame 'PixelFight.exe'),
            (Join-Path $legacyEditor 'PixelFightEditor.exe'),
            (Join-Path $legacyPlayer 'PixelPlayer.exe')
          )
          foreach ($executable in $requiredExecutables) {
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Legacy Windows executable missing after publish: $executable"
            }
          }
          Write-Host "Published the original Bloody Pixels Game, Editor and Player for Windows x64."

      - name: Assemble release ZIP and SHA-256
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $editorDir = Join-Path $env:RUNNER_TEMP 'pixelengine\editor'
          $playerDir = Join-Path $env:RUNNER_TEMP 'pixelengine\player'
          $playerPackageDir = Join-Path $env:RUNNER_TEMP 'pixelengine\package\Player'
          $legacyPublishRoot = Join-Path $env:RUNNER_TEMP 'pixelengine\legacy'
          $packageDir = Join-Path $env:RUNNER_TEMP 'pixelengine\package'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          $editorExe = Join-Path $editorDir 'PixelEngine.Editor.exe'
          $playerExe = Join-Path $playerDir 'PixelEngine.Sandbox.exe'
          $licDir = Join-Path $editorDir 'Lic'
          $demoFile = Join-Path $licDir 'demo.lic'
          $siteIndex = Join-Path (Get-Location).Path 'docs\index.html'
          $siteStyles = Join-Path (Get-Location).Path 'docs\style.css'
          $licenseFile = Join-Path (Get-Location).Path 'LICENSE'
          $gamesDir = Join-Path (Get-Location).Path 'Games'
          $ashfallProject = Join-Path $gamesDir 'Ashfall\Ashfall.lic'
          $ashfallLua = Join-Path $gamesDir 'Ashfall\Game\game.lua'
          $legacyRequired = @(
            'avatar.png',
            'BLOODY-PIXELS-LEGACY.md',
            'PIXELENGINE_2_MIGRATION.md',
            'README_PIXELENGINE_2.md',
            'PixelFight\PixelFight.csproj',
            'PixelFight.Editor\PixelFight.Editor.csproj',
            'PixelFight.Player\PixelFight.Player.csproj',
            'PixelFight.Droid\PixelFight.Droid.csproj',
            'PixelFight.Tests\PixelFight.Tests.csproj',
            'PixelFight.Tests\TestMain.cs'
          )
          $legacyFiles = @($legacyRequired | ForEach-Object { Join-Path (Get-Location).Path $_ })
          foreach ($required in @($editorExe, $playerExe, $demoFile, $siteIndex, $siteStyles, $licenseFile, $ashfallProject, $ashfallLua) + $legacyFiles) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required release file is missing: $required"
            }
          }

          Copy-Item -LiteralPath $editorExe -Destination $packageDir
          New-Item -ItemType Directory -Path $playerPackageDir -Force | Out-Null
          Get-ChildItem -LiteralPath $playerDir -Force | Copy-Item -Destination $playerPackageDir -Recurse -Force
          $packagedPlayer = Join-Path $playerPackageDir 'PixelEngine.Sandbox.exe'
          if (-not (Test-Path -LiteralPath $packagedPlayer -PathType Leaf)) {
            throw "Player executable is missing from the package: $packagedPlayer"
          }
          $packagedSdl = Get-ChildItem -LiteralPath $playerPackageDir -Filter 'SDL2.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $packagedSdl) {
            throw "SDL2.dll was not copied into the release package. Refusing to publish a Player that cannot create its window."
          }
          Write-Host "Packaged SDL runtime: $($packagedSdl.FullName)"
          Copy-Item -LiteralPath $licDir -Destination (Join-Path $packageDir 'Lic') -Recurse
          Copy-Item -LiteralPath $gamesDir -Destination (Join-Path $packageDir 'Games') -Recurse
          Copy-Item -LiteralPath 'docs' -Destination (Join-Path $packageDir 'Website') -Recurse
          Copy-Item -LiteralPath 'README.md' -Destination (Join-Path $packageDir 'README.md')
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $packageDir 'LICENSE')
          Copy-Item -LiteralPath 'RELEASE-README.txt' -Destination (Join-Path $packageDir 'README.txt')
          Copy-Item -LiteralPath 'RELEASE-NOTES-v2.0.0-preview.6.md' -Destination (Join-Path $packageDir 'RELEASE-NOTES.md')
          Copy-Item -LiteralPath 'BLOODY-PIXELS-LEGACY.md' -Destination (Join-Path $packageDir 'BLOODY-PIXELS-LEGACY.md')
          Copy-Item -LiteralPath 'PIXELENGINE_2_MIGRATION.md' -Destination (Join-Path $packageDir 'PIXELENGINE_2_MIGRATION.md')
          Copy-Item -LiteralPath 'README_PIXELENGINE_2.md' -Destination (Join-Path $packageDir 'README_PIXELENGINE_2.md')
          Copy-Item -LiteralPath 'avatar.png' -Destination (Join-Path $packageDir 'avatar.png')
          foreach ($legacyDirectory in @('PixelFight', 'PixelFight.Editor', 'PixelFight.Player', 'PixelFight.Droid', 'PixelFight.Tests')) {
            Copy-Item -LiteralPath $legacyDirectory -Destination $packageDir -Recurse -Force
          }

          $legacyWindowsPackage = Join-Path $packageDir 'BloodyPixels\Windows'
          foreach ($app in @(
            @{ Name = 'Game'; Source = (Join-Path $legacyPublishRoot 'game'); Executable = 'PixelFight.exe' },
            @{ Name = 'Editor'; Source = (Join-Path $legacyPublishRoot 'editor'); Executable = 'PixelFightEditor.exe' },
            @{ Name = 'Player'; Source = (Join-Path $legacyPublishRoot 'player'); Executable = 'PixelPlayer.exe' }
          )) {
            $destination = Join-Path $legacyWindowsPackage $app.Name
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Get-ChildItem -LiteralPath $app.Source -Force | Copy-Item -Destination $destination -Recurse -Force
            if (-not (Test-Path -LiteralPath (Join-Path $destination $app.Executable) -PathType Leaf)) {
              throw "Bloody Pixels $($app.Name) executable is missing from the final ZIP."
            }
          }
          # The legacy player opens game.lic beside its executable when no command-line
          # project is supplied. Bundle a known-good LIC sample for a one-click launch.
          Copy-Item -LiteralPath (Join-Path (Get-Location).Path 'Lic\world.lic') -Destination (Join-Path $legacyWindowsPackage 'Player\game.lic') -Force

          $packagedProjects = @(Get-ChildItem -LiteralPath $packageDir -Filter '*.lic' -File -Recurse)
          if ($packagedProjects.Count -lt 9) {
            throw "The release ZIP must include all built-in LIC projects and Ashfall; found $($packagedProjects.Count)."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'Games\Ashfall\Game\game.lua') -PathType Leaf)) {
            throw "Ashfall Lua source was not copied into the release ZIP."
          }
          if (-not (Get-ChildItem -LiteralPath (Join-Path $packageDir 'Games\Ashfall\Assets') -File | Select-Object -First 1)) {
            throw "Ashfall Assets were not copied into the release ZIP."
          }
          Write-Host "Release contains $($packagedProjects.Count) LIC projects plus Ashfall source and assets."

          foreach ($required in @(
            'avatar.png',
            'BLOODY-PIXELS-LEGACY.md',
            'PixelFight\PixelFight.csproj',
            'PixelFight.Editor\PixelFight.Editor.csproj',
            'PixelFight.Player\PixelFight.Player.csproj',
            'PixelFight.Droid\PixelFight.Droid.csproj',
            'PixelFight.Tests\PixelFight.Tests.csproj'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageDir $required) -PathType Leaf)) {
              throw "Preserved Bloody Pixels source is missing from the ZIP: $required"
            }
          }
          foreach ($legacyExecutable in @(
            'BloodyPixels\Windows\Game\PixelFight.exe',
            'BloodyPixels\Windows\Editor\PixelFightEditor.exe',
            'BloodyPixels\Windows\Player\PixelPlayer.exe',
            'BloodyPixels\Windows\Player\game.lic'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageDir $legacyExecutable) -PathType Leaf)) {
              throw "Bloody Pixels Windows app missing from release ZIP: $legacyExecutable"
            }
          }
          Write-Host "Legacy Bloody Pixels source and all three ready-to-run Windows apps are included."

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main' -and $env:HEAD_COMMIT_MESSAGE.StartsWith('release: v', [StringComparison]::Ordinal)) {
            $version = $env:HEAD_COMMIT_MESSAGE.Substring('release: '.Length).Trim()
          } else {
            $version = 'preview-' + $env:GITHUB_SHA.Substring(0, 7)
          }

          $zipName = "PixelEngine-$version-win-x64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$zipPath.sha256"
          "$hash  $zipName" | Set-Content -LiteralPath $checksumPath -Encoding ASCII

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (
            github.ref == 'refs/heads/main' &&
            github.event_name == 'push' &&
            startsWith(github.event.head_commit.message, 'release: v')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PixelEngine ${{ steps.package.outputs.version }}
          body_path: RELEASE-NOTES-v2.0.0-preview.6.md
          prerelease: ${{ contains(steps.package.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.package.outputs.version, '-') }}
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          fail_on_unmatched_files: true
